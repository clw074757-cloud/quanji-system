<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全技工程行 - 管理系統 v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- 樣式重置與基本設定 --- */
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #000000; 
            color: #fca5a5; 
            font-size: 18px; 
            -webkit-tap-highlight-color: transparent; 
        }
        .hidden { display: none !important; }
        
        /* 卡片設計 */
        .card { 
            background: #171717; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.1); 
            margin-bottom: 20px; 
            border: 2px solid #7f1d1d; 
        }
        
        /* 今日任務卡片 (黃色高亮) */
        .card-today {
            border-color: #f59e0b; /* 琥珀黃 */
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
        }

        /* 未來任務卡片 (灰色/藍色高亮) */
        .card-future {
            border-color: #4b5563; /* 灰色 */
            box-shadow: 0 4px 15px rgba(75, 85, 99, 0.2);
            opacity: 0.9;
        }
        
        /* 輸入框強制樣式 (修復自動填入變白色的問題) */
        .input-box { 
            width: 100%; 
            padding: 16px; 
            background-color: #262626 !important; 
            border: 2px solid #7f1d1d; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: bold;
            outline: none; 
            margin-bottom: 12px; 
            color: #fca5a5 !important; 
            display: block; 
            box-sizing: border-box;
        }
        .input-box::placeholder { color: #7f1d1d; opacity: 1; }
        .input-box:focus { border-color: #ef4444; background-color: #000000 !important; }
        
        /* 針對 Chrome 自動填入的強制覆蓋 */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #262626 inset !important;
            -webkit-text-fill-color: #fca5a5 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* 選單樣式優化 */
        select.input-box {
            appearance: none; 
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23dc2626' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1.5em;
        }

        /* Checkbox 樣式 */
        .custom-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: #262626;
            border: 1px solid #7f1d1d;
            border-radius: 8px;
            cursor: pointer;
        }
        .custom-checkbox input {
            width: 20px;
            height: 20px;
            accent-color: #dc2626;
        }

        /* 按鈕樣式 */
        .btn { 
            width: 100%; 
            padding: 18px; 
            border-radius: 14px; 
            font-weight: 900; 
            font-size: 20px; 
            color: #000000; 
            transition: 0.2s; 
            text-align: center; 
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 4px 0 rgba(50, 0, 0, 0.5); 
            cursor: pointer;
            border: none;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-primary { background-color: #dc2626; } 
        .btn-secondary { background-color: #404040; color: #fca5a5; } 
        .btn-warning { background-color: #f59e0b; color: #000000; } 
        .btn-success { background-color: #10b981; color: #000000; }
        
        /* 底部導航 */
        .nav-bar { background-color: #0f0f0f; border-top: 2px solid #7f1d1d; }
        .nav-btn { flex: 1; text-align: center; padding: 12px; color: #7f1d1d; font-size: 14px; font-weight: 900; background: #0f0f0f; border: none; min-width: 0; }
        .nav-btn.active { color: #ef4444; background: #1a0505; border-top: 4px solid #dc2626; }
        .nav-icon { width: 28px; height: 28px; margin: 0 auto 4px; display: block; fill: currentColor; } 

        /* 圖片網格 */
        .img-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .img-grid img {
            width: 100%;
            height: 120px; 
            object-fit: contain; 
            background-color: #262626; 
            border-radius: 8px;
            border: 1px solid #7f1d1d;
            cursor: pointer;
        }

        /* 文字標籤 */
        .text-label { 
            color: #b91c1c; 
            font-weight: bold; 
            margin-bottom: 6px; 
            display: block; 
            font-size: 16px;
        }
        .map-link { color: #ef4444; text-decoration: underline; font-size: 0.9rem; font-weight: bold; }

        /* 讀取中動畫 (Spinner) */
        .loader {
            border: 8px solid #262626;
            border-top: 8px solid #dc2626;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

    <script>
        // 設定 Supabase 與基本參數
        const PROJECT_URL = 'https://vegqsdqxnvqupmzsgbpt.supabase.co';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZ3FzZHF4bnZxdXBtenNnYnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3OTI0MDAsImV4cCI6MjA4NTM2ODQwMH0.ZHluSDbAD_ih4GH25ZBXZGogorfNUfBOcICb5pvhIq0';
        
        let supabaseClient = null;
        if(window.supabase) {
            supabaseClient = window.supabase.createClient(PROJECT_URL, ANON_KEY);
        }

        const DB_URL = `${PROJECT_URL}/rest/v1/construction_records`;
        const STORAGE_URL = `${PROJECT_URL}/storage/v1/object/site_photos`;
        const HEADERS = { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

        let allData = [];
        let currentUser = null;
        let currentLocation = null;
        let currentWeeklyData = {}; // 暫存本週計算結果，供結算使用

        window.onload = async function() {
            if(window.supabase && !supabaseClient) {
                supabaseClient = window.supabase.createClient(PROJECT_URL, ANON_KEY);
            }

            // 1. 啟動時鐘
            setInterval(() => {
                const n = new Date();
                const timeStr = n.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
                const dateStr = n.toLocaleString('zh-TW', {weekday:'long', month:'long', day:'numeric'});
                if(document.getElementById('current-time-display')) document.getElementById('current-time-display').innerText = `${dateStr} ${timeStr}`;
            }, 1000);

            // 2. 啟動定位
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    p => {
                        currentLocation = `${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;
                        document.getElementById('gps-status').innerHTML = `📍 已定位`;
                        document.getElementById('gps-status').className = "text-sm font-bold text-[#fca5a5] bg-[#1a0505] px-3 py-1 rounded-full border border-[#dc2626]";
                    },
                    e => {
                        document.getElementById('gps-status').innerText = "⚠️ 定位失敗";
                        document.getElementById('gps-status').className = "text-sm font-bold text-[#dc2626] bg-[#1a0505] px-3 py-1 rounded-full border border-[#dc2626]";
                    }
                );
            } else {
                document.getElementById('gps-status').innerText = "⚠️ 裝置不支援定位";
            }
            
            // 3. 載入資料
            await loadData();
            
            // 4. 自動登入
            const savedId = localStorage.getItem('last_user_id');
            if (savedId) {
                if(savedId === 'admin') {
                    currentUser = { employee_name: '超級管理員', is_admin: true, employee_id: 'admin' };
                    performLogin(currentUser);
                } else {
                    const user = allData.find(r => r.type === 'employee' && r.employee_id === savedId);
                    if (user) {
                        currentUser = user;
                        performLogin(user);
                    }
                }
            }
            
            // 5. 設定預設日期 (派工用)
            document.getElementById('dispatch-date').valueAsDate = new Date();
        };

        // --- 功能函式區 ---

        async function loadData() {
            try {
                const res = await fetch(`${DB_URL}?select=*&order=created_at.desc`, { headers: HEADERS });
                if (!res.ok) throw new Error("連線錯誤");
                const data = await res.json();
                allData = data.map(row => ({ id: row.id, type: row.type, created_at: row.created_at, ...row.data }));
                if(currentUser) render(); 
            } catch (e) {
                console.error("Data load error:", e);
                const loginMsg = document.getElementById('login-msg');
                if(loginMsg) loginMsg.innerText = "連線失敗，請檢查網路";
                if(currentUser) render();
            }
        }

        function doLogin() {
            const inputVal = document.getElementById('login-id').value.trim();
            const pwd = document.getElementById('login-pwd').value.trim();
            const msg = document.getElementById('login-msg');

            if(allData.length === 0 && inputVal !== 'admin') {
                msg.innerText = "資料載入中，請稍後再試...";
                loadData(); 
                return;
            }

            if(!inputVal || !pwd) { msg.innerText = "請輸入姓名或帳號"; return; }
            
            // 後門
            if (inputVal === 'admin' && pwd === 'admin') {
                currentUser = { employee_name: '超級管理員', is_admin: true, employee_id: 'admin' };
                localStorage.setItem('last_user_id', 'admin');
                performLogin(currentUser);
                return;
            }

            const user = allData.find(r => 
                r.type === 'employee' && 
                (r.employee_name === inputVal || r.employee_id === inputVal || r.employee_code === inputVal)
            );

            if(user && user.password === pwd) {
                localStorage.setItem('last_user_id', user.employee_id);
                currentUser = user;
                performLogin(user);
            } else {
                msg.innerText = "帳號/姓名或密碼錯誤";
            }
        }

        function performLogin(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('welcome-name').innerText = user.employee_name;
            
            const roleText = user.is_admin ? ' (管理員)' : ' (員工)';
            document.getElementById('user-role-display').innerText = user.employee_name + roleText;
            
            document.getElementById('login-msg').innerText = "";
            
            setupNav();
            nav('clock'); // 預設進入打卡頁
            render();

            try {
                requestNotificationPermission();
                if(supabaseClient) setupRealtimeListener();
            } catch(e) {
                console.log("Realtime setup failed:", e);
            }
        }

        function render() {
            const isAdmin = currentUser.is_admin;
            const emps = allData.filter(r => r.type === 'employee');

            // 1. 渲染「即將到來的任務」 (打卡頁)
            const today = new Date();
            today.setHours(0,0,0,0); 
            
            const myMissions = allData.filter(r => {
                if (r.type !== 'dispatch') return false;
                const taskDate = new Date(r.timestamp);
                taskDate.setHours(0,0,0,0);
                if (taskDate < today) return false;

                if (currentUser.employee_id === 'admin') return false;

                const isLeader = r.employee_name === currentUser.employee_name;
                const isPartner = (r.partners || '').includes(currentUser.employee_name);
                
                return isLeader || isPartner;
            }).sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
            
            const missionContainer = document.getElementById('upcoming-missions-container');
            
            if(myMissions.length > 0) {
                missionContainer.innerHTML = myMissions.map(m => {
                    const mDate = new Date(m.timestamp);
                    mDate.setHours(0,0,0,0);
                    const isToday = mDate.getTime() === today.getTime();
                    
                    const dateDisplay = mDate.toLocaleDateString('zh-TW');
                    const cardClass = isToday ? 'card-today border-l-yellow-500' : 'card-future border-l-gray-500';
                    const badgeColor = isToday ? 'bg-yellow-500 text-black' : 'bg-gray-600 text-white';
                    const badgeText = isToday ? '今日任務' : `預約派工 (${dateDisplay})`;
                    
                    const partnerText = m.partners ? `<div class="mt-1 text-sm text-[#fca5a5]">👥 陪同：<span class="font-bold">${m.partners}</span></div>` : '';

                    return `
                    <div class="card ${cardClass} border-l-8 mb-4 relative">
                        <div class="absolute -top-3 -right-2 ${badgeColor} font-black px-3 py-1 rounded-full shadow-lg transform rotate-3 text-sm">${badgeText}</div>
                        <h3 class="text-xl font-black ${isToday ? 'text-yellow-500' : 'text-gray-400'} mb-2">🚀 任務指派</h3>
                        <div class="mb-1"><span class="text-[#7f1d1d] font-bold">負責：</span><span class="text-[#fca5a5] font-bold text-lg">${m.employee_name}</span></div>
                        <div class="mb-1"><span class="text-[#7f1d1d] font-bold">地點：</span><span class="text-[#fca5a5] font-bold text-lg">${m.project_name}</span></div>
                        ${partnerText}
                        <div class="bg-[#262626] p-3 rounded border border-yellow-900/30 text-[#fca5a5] font-bold mt-2">${m.notes}</div>
                    </div>`;
                }).join('');
            } else {
                missionContainer.innerHTML = '';
            }

            // 2. 渲染「全體任務總覽」列表
            const allTasks = allData.filter(r => r.type === 'dispatch').sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            document.getElementById('public-task-list').innerHTML = allTasks.map(t => {
                const dateStr = new Date(t.timestamp).toLocaleDateString('zh-TW');
                const isToday = dateStr === new Date().toLocaleDateString('zh-TW');
                const dateBadge = isToday 
                    ? `<span class="bg-yellow-500 text-black px-2 py-0.5 rounded text-xs font-black">今天</span>`
                    : `<span class="bg-[#262626] text-[#7f1d1d] px-2 py-0.5 rounded text-xs font-bold border border-[#7f1d1d]">${dateStr}</span>`;
                const partnerBadge = t.partners ? `<div class="text-sm text-yellow-700 mt-1 font-bold">👥 陪同：${t.partners}</div>` : '';

                return `
                    <div class="bg-[#171717] border border-yellow-900/50 rounded-xl p-4 shadow-sm">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2">
                                <span class="text-lg font-black text-yellow-500">${t.employee_name}</span>
                                ${dateBadge}
                            </div>
                        </div>
                        <div class="mb-1">
                            <span class="text-[#7f1d1d] font-bold text-sm">地點：</span>
                            <span class="text-[#fca5a5] font-bold">${t.project_name}</span>
                        </div>
                        ${partnerBadge}
                        <div class="text-[#fca5a5] text-sm bg-[#262626] p-2 rounded border border-[#7f1d1d]/30 mt-2">
                            ${t.notes}
                        </div>
                    </div>
                `;
            }).join('') || '<div class="text-center text-[#7f1d1d] font-bold py-10">尚無派工記錄</div>';


            // 3. 渲染回報列表
            const bulletins = allData.filter(r => r.type === 'progress');
            document.getElementById('bulletin-list').innerHTML = bulletins.map(r => {
                const time = new Date(r.timestamp).toLocaleString('zh-TW', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
                let imgsHtml = '';
                if(r.image_url) {
                    const urls = Array.isArray(r.image_url) ? r.image_url : [r.image_url];
                    if(urls.length > 0) {
                        imgsHtml = `<div class="img-grid">` + 
                            urls.map(url => `<img src="${url}" onclick="window.open('${url}', '_blank')">`).join('') + 
                            `</div>`;
                    }
                }
                const btns = isAdmin ? `<div class="absolute top-4 right-4"><button onclick="del(this,${r.id})" class="text-[#ef4444] font-bold bg-black px-2 rounded border border-[#7f1d1d]">✕</button></div>` : '';
                return `
                <div class="card relative">
                    ${btns}
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-10 h-10 rounded-full bg-[#404040] flex items-center justify-center font-bold text-[#fca5a5] text-lg border border-[#7f1d1d]">${r.employee_name[0]}</div>
                        <div>
                            <div class="font-bold text-[#fca5a5] text-lg">${r.employee_name}</div>
                            <div class="text-xs text-[#7f1d1d] font-bold">${time}</div>
                        </div>
                    </div>
                    <div class="font-bold text-xl text-[#ef4444] mb-1">${r.project_name}</div>
                    <div class="text-[#fca5a5] font-bold bg-[#262626] p-3 rounded-lg border border-[#7f1d1d]">${r.notes}</div>
                    ${imgsHtml}
                </div>`;
            }).join('') || '<div class="text-center text-[#7f1d1d] font-bold py-10">尚無回報資料</div>';

            // 4. 渲染個人打卡記錄
            const myRecs = allData.filter(r => r.type === 'clock' && r.employee_name === currentUser.employee_name).slice(0, 20);
            document.getElementById('my-records-list').innerHTML = myRecs.map(r => {
                const otDisplay = getOvertimeDisplay(r);
                const locDisplay = r.location ? `<a href="https://www.google.com/maps/search/?api=1&query=${r.location}" target="_blank" class="map-link">📍 查看地圖 (${r.location})</a>` : '';
                return `
                <div class="flex justify-between items-center p-4 bg-[#171717] rounded-xl border-l-8 ${r.check_type==='上班'?'border-l-green-600':'border-l-orange-600'} border-2 border-[#262626] shadow-sm mb-2">
                    <div class="flex flex-col">
                        <div class="flex items-center">
                            <span class="font-black text-lg text-[#fca5a5] mr-2">${r.check_type}</span>
                            ${otDisplay}
                        </div>
                        ${locDisplay}
                    </div>
                    <span class="font-bold text-lg text-[#7f1d1d] font-mono">
                        ${new Date(r.timestamp).toLocaleString('zh-TW', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}
                    </span>
                </div>
            `}).join('') || '<div class="text-[#7f1d1d] font-bold text-center">無記錄</div>';

            // 5. 管理員後台介面
            if (isAdmin) {
                const dispatchSelect = document.getElementById('dispatch-emp-select');
                dispatchSelect.innerHTML = emps.map(e => `<option value="${e.employee_name}">${e.employee_name}</option>`).join('');
                
                const partnerContainer = document.getElementById('dispatch-partners-list');
                partnerContainer.innerHTML = emps.map(e => `
                    <label class="custom-checkbox">
                        <input type="checkbox" value="${e.employee_name}">
                        <span class="text-[#fca5a5] font-bold">${e.employee_name}</span>
                    </label>
                `).join('');

                const dispatches = allData.filter(r => r.type === 'dispatch'); 
                document.getElementById('dispatch-list').innerHTML = dispatches.map(d => {
                    const dateStr = new Date(d.timestamp).toLocaleDateString('zh-TW');
                    const partnerText = d.partners ? `<br><span class="text-xs text-yellow-700">與 ${d.partners}</span>` : '';
                    return `
                        <div class="bg-[#262626] p-3 rounded border border-yellow-900 flex justify-between items-start">
                            <div>
                                <div class="font-bold text-yellow-500">${dateStr} ➤ ${d.employee_name}</div>
                                <div class="text-[#fca5a5] font-bold">${d.project_name} ${partnerText}</div>
                                <div class="text-sm text-[#7f1d1d]">${d.notes}</div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="openEdit(${d.id})" class="text-sm text-[#fca5a5] border border-[#fca5a5] px-2 rounded">✏️</button>
                                <button onclick="del(this, ${d.id})" class="text-sm text-[#ef4444] border border-[#ef4444] px-2 rounded">✕</button>
                            </div>
                        </div>
                    `;
                }).join('') || '<div class="text-center text-[#7f1d1d] text-sm">無派工記錄</div>';

                // --- 薪資計算邏輯 (自動計算本週) ---
                const empMap = {};
                const empCodeMap = {}; // 存員工編號
                emps.forEach(e => {
                    empMap[e.employee_name] = parseInt(e.wage) || 0;
                    empCodeMap[e.employee_name] = e.employee_code || '';
                });

                const now = new Date();
                const dayOfWeek = now.getDay(); 
                const distanceToMonday = (dayOfWeek + 6) % 7;
                const monday = new Date(now);
                monday.setDate(now.getDate() - distanceToMonday);
                monday.setHours(0,0,0,0);
                const nextMonday = new Date(monday);
                nextMonday.setDate(monday.getDate() + 7);

                // 保存計算結果的物件，供結算使用
                currentWeeklyData = {
                    startDate: monday.toLocaleDateString('zh-TW'),
                    endDate: nextMonday.toLocaleDateString('zh-TW'),
                    details: []
                };

                const dailyGroups = {};
                allData.filter(r => r.type === 'clock').forEach(r => {
                    const t = new Date(r.timestamp);
                    if (t >= monday && t < nextMonday) {
                        const dateStr = t.toDateString();
                        const key = `${r.employee_name}|${dateStr}`;
                        if (!dailyGroups[key]) dailyGroups[key] = { start: null, end: null };
                        const timeVal = t.getTime();
                        if (r.check_type === '上班') {
                            if (!dailyGroups[key].start || timeVal < dailyGroups[key].start) dailyGroups[key].start = timeVal;
                        } else if (r.check_type === '下班') {
                            if (!dailyGroups[key].end || timeVal > dailyGroups[key].end) dailyGroups[key].end = timeVal;
                        }
                    }
                });

                const weeklyCalc = {};
                const workDaysCount = {};

                Object.entries(dailyGroups).forEach(([key, times]) => {
                    const [name, date] = key.split('|');
                    const wage = empMap[name] || 0;

                    if (times.start && times.end) {
                        const durationMs = times.end - times.start;
                        const durationHrs = durationMs / (1000 * 60 * 60);
                        const netHrs = Math.max(0, durationHrs - 1); 

                        let dayPay = 0;
                        if (netHrs >= 8) {
                            dayPay = wage;
                        } else {
                            const hourlyRate = wage / 8;
                            dayPay = Math.floor(netHrs * hourlyRate);
                        }

                        if (!weeklyCalc[name]) weeklyCalc[name] = 0;
                        weeklyCalc[name] += dayPay;

                        if (!workDaysCount[name]) workDaysCount[name] = 0;
                        workDaysCount[name] += 1; 
                    }
                });

                let totalSalary = 0;
                document.getElementById('employee-list').innerHTML = emps.map(e => {
                    const pay = weeklyCalc[e.employee_name] || 0;
                    const days = workDaysCount[e.employee_name] || 0;
                    totalSalary += pay;
                    
                    // 將每個人的數據存入 currentWeeklyData，只有當金額大於0時才存，或全部存
                    if (pay > 0) {
                        currentWeeklyData.details.push({
                            name: e.employee_name,
                            code: e.employee_code,
                            pay: pay,
                            days: days
                        });
                    }

                    const adminBadge = e.is_admin ? '<span class="bg-[#dc2626] text-black text-xs px-1 rounded ml-2 font-black">ADMIN</span>' : '';
                    const codeDisplay = e.employee_code ? `<span class="text-yellow-500 font-mono text-sm mr-1">[${e.employee_code}]</span>` : '';

                    return `
                    <div class="flex justify-between items-center p-4 bg-[#171717] rounded-xl border-2 border-[#262626]">
                        <div>
                            <div class="font-black text-lg text-[#fca5a5]">${codeDisplay}${e.employee_name} ${adminBadge}</div>
                            <div class="text-sm font-bold text-[#7f1d1d]">$${e.wage}/日 (本週${days}天)</div>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <div class="font-black text-[#dc2626] text-xl">$${pay.toLocaleString()}</div>
                            <div class="flex gap-2">
                                <button onclick="openEdit(${e.id})" class="text-sm text-[#fca5a5] border border-[#fca5a5] px-2 rounded hover:bg-[#262626]">✏️ 修改</button>
                                <button onclick="del(this, ${e.id})" class="text-sm text-[#ef4444] border border-[#ef4444] px-2 rounded hover:bg-[#262626]">刪除</button>
                            </div>
                        </div>
                    </div>`;
                }).join('');
                document.getElementById('total-wage').innerText = '$' + totalSalary.toLocaleString();
                currentWeeklyData.total = totalSalary;

                // --- 渲染歷史薪資記錄 ---
                const historyRecs = allData.filter(r => r.type === 'payout_history');
                if (historyRecs.length > 0) {
                    document.getElementById('payout-history-list').innerHTML = historyRecs.map(h => {
                        const date = new Date(h.timestamp).toLocaleString('zh-TW', {month:'numeric', day:'numeric', hour:'2-digit'});
                        return `
                        <div class="bg-[#262626] border border-green-900 rounded-lg p-3 cursor-pointer" onclick="alert('發放詳情:\\n${h.details.map(d=>d.name + ': $' + d.pay).join('\\n')}')">
                            <div class="flex justify-between items-center">
                                <div>
                                    <div class="text-green-500 font-bold">💰 已發放: $${h.total_amount.toLocaleString()}</div>
                                    <div class="text-[#7f1d1d] text-xs font-bold">結算日: ${date}</div>
                                </div>
                                <div class="text-xs text-[#fca5a5] bg-black px-2 py-1 rounded border border-[#7f1d1d]">查看詳情</div>
                            </div>
                        </div>`;
                    }).join('');
                } else {
                    document.getElementById('payout-history-list').innerHTML = '<div class="text-center text-[#7f1d1d]">無歷史記錄</div>';
                }

                const clocks = allData.filter(r => r.type === 'clock');
                document.getElementById('admin-clock-list').innerHTML = clocks.map(r => {
                    const time = new Date(r.timestamp).toLocaleString('zh-TW', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
                    const otDisplay = getOvertimeDisplay(r);
                    const locDisplay = r.location ? `<a href="https://www.google.com/maps/search/?api=1&query=${r.location}" target="_blank" class="map-link">📍 查看地圖</a>` : '';
                    return `
                    <div class="flex justify-between items-center p-3 bg-[#171717] rounded-lg border border-[#262626] shadow-sm relative group">
                        <div class="flex flex-col">
                            <div>
                                <span class="font-black text-[#fca5a5] mr-2">${r.employee_name}</span>
                                <span class="text-[#7f1d1d] font-bold text-sm">${time}</span>
                            </div>
                            <div class="mt-1">${otDisplay}</div>
                            ${locDisplay}
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold ${r.check_type==='上班'?'text-green-600':'text-orange-600'}">${r.check_type}</span>
                            <button onclick="openEdit(${r.id})" class="bg-[#262626] text-[#fca5a5] px-2 rounded text-sm border border-[#7f1d1d]">✏️</button>
                            <button onclick="del(this, ${r.id})" class="text-[#ef4444] font-bold px-2">✕</button>
                        </div>
                    </div>`;
                }).join('');
            }
        }

        // --- 新增：結算薪資功能 ---
        async function settleSalary() {
            if (!currentWeeklyData || currentWeeklyData.total === 0) {
                alert("目前沒有可結算的金額");
                return;
            }
            if (!confirm(`確定要結算本週薪資嗎？\n總金額: $${currentWeeklyData.total}\n這將會儲存一份歷史記錄。`)) {
                return;
            }

            const payload = {
                timestamp: new Date().toISOString(),
                start_date: currentWeeklyData.startDate,
                end_date: currentWeeklyData.endDate,
                total_amount: currentWeeklyData.total,
                details: currentWeeklyData.details,
                settled_by: currentUser.employee_name
            };

            if (await insertData('payout_history', payload)) {
                alert("薪資已結算並歸檔！");
                await loadData();
            } else {
                alert("結算失敗，請重試");
            }
        }

        function setupNav() {
            const nav = document.getElementById('bottom-nav');
            if (currentUser.is_admin) {
                // 管理員：4 個按鈕
                nav.innerHTML = `
                    <button onclick="nav('clock')" class="nav-btn active" id="btn-clock"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>打卡</button>

        function getOvertimeDisplay(record) {
            if (record.check_type !== '下班') return '';
            const currentObj = new Date(record.timestamp);
            const currentDateStr = currentObj.toDateString(); 
            const startRecords = allData.filter(r => 
                r.type === 'clock' &&
                r.employee_name === record.employee_name &&
                r.check_type === '上班' &&
                new Date(r.timestamp).toDateString() === currentDateStr
            );
            if (startRecords.length === 0) return '';
            const timestamps = startRecords.map(r => new Date(r.timestamp).getTime());
            const firstClockInTime = Math.min(...timestamps);
            const durationMs = currentObj.getTime() - firstClockInTime;
            const durationHrs = durationMs / (1000 * 60 * 60);
            
            if (durationHrs > 9) {
                const ot = durationHrs - 9;
                return `<span class="text-[#dc2626] font-black text-sm ml-2 bg-[#262626] px-2 py-1 rounded-full border border-[#7f1d1d]">加班 ${ot.toFixed(1)}h</span>`;
            }
            return '';
        }

        async function clockIn(type) {
            const name = currentUser.employee_name;
            const btn = event.currentTarget;
            btn.innerText = "處理中...";
            const locToSend = currentLocation || "未取得定位";
            if(await insertData('clock', { employee_name: name, check_type: type, timestamp: new Date().toISOString(), location: locToSend })) {
                alert("打卡成功"); await loadData();
            } else { alert("失敗"); }
            btn.innerHTML = type;
        }

        async function submitProgress() {
            const name = currentUser.employee_name;
            const proj = document.getElementById('prog-project').value;
            const val = ""; 
            const note = document.getElementById('prog-note').value;
            const fileInput = document.getElementById('file-upload');
            if(!proj) return alert("請輸入工程名稱");
            
            const loadingOverlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');
            loadingOverlay.classList.remove('hidden');
            
            let imgUrls = [];
            if(fileInput.files.length > 0) {
                loadingText.innerText = `正在上傳照片 (0/${fileInput.files.length})...`;
                for(let i=0; i<fileInput.files.length; i++) {
                    loadingText.innerText = `正在上傳照片 (${i+1}/${fileInput.files.length})...`;
                    const url = await uploadFileAPI(fileInput.files[i]);
                    if(url) imgUrls.push(url);
                }
            }
            
            loadingText.innerText = "正在儲存回報...";
            
            if(await insertData('progress', { employee_name: name, project_name: proj, progress: val, notes: note, image_url: imgUrls, timestamp: new Date().toISOString(), location: currentLocation })) {
                alert("發佈成功"); 
                document.getElementById('prog-project').value = ''; document.getElementById('prog-note').value = ''; 
                clearImages(); await loadData();
            } else { 
                alert("發佈失敗"); 
            }
            loadingOverlay.classList.add('hidden');
        }

        function previewImages(input) {
            const container = document.getElementById('preview-container');
            const placeholder = document.getElementById('upload-placeholder');
            const clearBtn = document.getElementById('clear-btn');
            container.innerHTML = ''; 
            if (input.files && input.files.length > 0) {
                placeholder.classList.add('hidden');
                container.classList.remove('hidden');
                clearBtn.classList.remove('hidden');
                Array.from(input.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img'); img.src = e.target.result;
                        img.className = 'w-full h-20 object-contain rounded-lg border border-[#7f1d1d] bg-[#262626]';
                        container.appendChild(img);
                    }
                    reader.readAsDataURL(file);
                });
            }
        }

        function clearImages() {
            document.getElementById('file-upload').value = '';
            document.getElementById('preview-container').innerHTML = '';
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('hidden');
            document.getElementById('clear-btn').classList.add('hidden');
        }

        let currentEditId, currentEditData;
        function openEdit(id) {
            const r = allData.find(d => d.id === id); if(!r) return;
            currentEditId = id; currentEditData = r;
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-type').value = r.type;
            document.getElementById('edit-name').value = r.employee_name;
            
            const areas = ['edit-time-group', 'edit-clock-area', 'edit-prog-area', 'edit-emp-area', 'edit-dispatch-area'];
            areas.forEach(a => document.getElementById(a).classList.add('hidden'));

            if(r.type === 'employee') {
                document.getElementById('edit-emp-area').classList.remove('hidden');
                document.getElementById('edit-wage').value = r.wage || '';
                document.getElementById('edit-pwd').value = r.password || '';
                document.getElementById('edit-code').value = r.employee_code || ''; // 員工編號
                document.getElementById('edit-is-admin').checked = !!r.is_admin; 
            } else if (r.type === 'dispatch') {
                document.getElementById('edit-dispatch-area').classList.remove('hidden');
                document.getElementById('edit-time-group').classList.remove('hidden');
                
                const dt = new Date(r.timestamp);
                dt.setMinutes(dt.getMinutes() - dt.getTimezoneOffset());
                document.getElementById('edit-time').value = dt.toISOString().slice(0,16);

                document.getElementById('edit-dispatch-emp').value = r.employee_name;
                document.getElementById('edit-dispatch-loc').value = r.project_name || '';
                document.getElementById('edit-dispatch-note').value = r.notes || '';
                
                const emps = allData.filter(x => x.type === 'employee');
                const currentPartners = (r.partners || '').split(', ').filter(x=>x);
                document.getElementById('edit-dispatch-partners-list').innerHTML = emps.map(e => `
                    <label class="custom-checkbox">
                        <input type="checkbox" value="${e.employee_name}" ${currentPartners.includes(e.employee_name) ? 'checked' : ''}>
                        <span class="text-[#fca5a5] font-bold">${e.employee_name}</span>
                    </label>
                `).join('');

            } else {
                const dt = new Date(r.timestamp || r.created_at);
                dt.setMinutes(dt.getMinutes() - dt.getTimezoneOffset());
                document.getElementById('edit-time').value = dt.toISOString().slice(0,16);
                document.getElementById('edit-time-group').classList.remove('hidden');
                
                if(r.type === 'clock') {
                    document.getElementById('edit-clock-area').classList.remove('hidden');
                    document.getElementById('edit-check-type').value = r.check_type;
                } else {
                    document.getElementById('edit-prog-area').classList.remove('hidden');
                    document.getElementById('edit-proj').value = r.project_name||'';
                    document.getElementById('edit-prog').value = r.progress||'';
                    document.getElementById('edit-note').value = r.notes||'';
                }
            }
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEdit() { document.getElementById('edit-modal').classList.add('hidden'); }
        
        async function saveEdit() {
            const type = document.getElementById('edit-type').value;
            const payload = { ...currentEditData };
            delete payload.id; delete payload.type; delete payload.created_at;
            
            if(type === 'employee') {
                payload.employee_name = document.getElementById('edit-name').value;
                payload.wage = document.getElementById('edit-wage').value;
                payload.password = document.getElementById('edit-pwd').value;
                payload.employee_code = document.getElementById('edit-code').value; // 存入員工編號
                payload.is_admin = document.getElementById('edit-is-admin').checked; 
            } else if (type === 'dispatch') {
                const newTime = new Date(document.getElementById('edit-time').value).toISOString();
                payload.timestamp = newTime;
                payload.project_name = document.getElementById('edit-dispatch-loc').value;
                payload.notes = document.getElementById('edit-dispatch-note').value;
                const checkboxes = document.querySelectorAll('#edit-dispatch-partners-list input[type="checkbox"]:checked');
                payload.partners = Array.from(checkboxes).map(cb => cb.value).join(', ');
            } else {
                const newTime = new Date(document.getElementById('edit-time').value).toISOString();
                payload.timestamp = newTime;
                if(type === 'clock') payload.check_type = document.getElementById('edit-check-type').value;
                else {
                    payload.project_name = document.getElementById('edit-proj').value;
                    payload.progress = document.getElementById('edit-prog').value;
                    payload.notes = document.getElementById('edit-note').value;
                }
            }
            if(await updateDataAPI(currentEditId, payload)) { alert("修改成功"); closeEdit(); await loadData(); }
        }

        async function addEmployee() {
            const name = document.getElementById('new-name').value;
            const id = document.getElementById('new-id').value;
            const code = document.getElementById('new-code').value; // 讀取員工編號
            const wage = document.getElementById('new-wage').value;
            const pwd = document.getElementById('new-pwd').value || "1234";
            const isAdmin = document.getElementById('new-is-admin').checked; 

            if(!name) return alert("請輸入姓名");
            const finalId = id || name; 

            if(await insertData('employee', { 
                employee_name: name, 
                employee_id: finalId,
                employee_code: code, // 存入
                wage: wage, 
                password: pwd,
                is_admin: isAdmin 
            })) {
                alert("新增成功"); 
                document.getElementById('new-name').value=''; 
                document.getElementById('new-id').value=''; 
                document.getElementById('new-code').value='';
                document.getElementById('new-wage').value='';
                await loadData();
            }
        }

        function logout() { 
            localStorage.removeItem('last_user_id');
            location.reload(); 
        }
        function nav(p) { 
            ['clock', 'bulletin', 'admin', 'task'].forEach(v => {
                const el = document.getElementById('page-'+v);
                const btn = document.getElementById('btn-'+v);
                if(el) el.classList.add('hidden');
                if(btn) btn.classList.remove('active');
            });
            const el = document.getElementById('page-'+p);
            const btn = document.getElementById('btn-'+p);
            if(el) el.classList.remove('hidden');
            if(btn) btn.classList.add('active');
        }
        
        function requestNotificationPermission() {
            if ("Notification" in window) Notification.requestPermission();
        }

        function setupRealtimeListener() {
            const channel = supabaseClient.channel('room1')
                .on(
                    'postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'construction_records' },
                    (payload) => {
                        const newRecord = payload.new;
                        if(newRecord.type === 'employee' || newRecord.type === 'dispatch') return;
                        const msg = `${newRecord.employee_name} 已提交：${newRecord.type === 'clock' ? newRecord.check_type : '施工回報'}`;
                        showBrowserNotification(msg);
                        setTimeout(() => loadData(), 1000); 
                    }
                )
                .subscribe();
        }

        function showBrowserNotification(message) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("全技工程行 - 新動態", {
                    body: message,
                    icon: 'https://vegqsdqxnvqupmzsgbpt.supabase.co/storage/v1/object/public/site_photos/F21060CB-BAB1-4E07-91AC-1E3F35796914.png'
                });
            }
        }

        async function insertData(t, d) { try{const r=await fetch(DB_URL,{method:'POST',headers:HEADERS,body:JSON.stringify({type:t,data:d})});return r.ok;}catch(e){return false;} }
        async function updateDataAPI(i, d) { try{const r=await fetch(`${DB_URL}?id=eq.${i}`,{method:'PATCH',headers:HEADERS,body:JSON.stringify({data:d})});return r.ok;}catch(e){return false;} }
        async function deleteDataAPI(i) { await fetch(`${DB_URL}?id=eq.${i}`,{method:'DELETE',headers:HEADERS}); return true; }
        async function del(b,i) { if(confirm("確定刪除？")) if(await deleteDataAPI(i)) await loadData(); }
        async function uploadFileAPI(f) { 
            const n=`img_${Date.now()}_${Math.random().toString(36).substr(2, 5)}.jpg`; 
            try{
                const r=await fetch(`${STORAGE_URL}/${n}`,{method:'POST',headers:{'apikey':ANON_KEY,'Authorization':`Bearer ${ANON_KEY}`,'Content-Type':f.type,'x-upsert':'true'},body:f});
                if(!r.ok)return null; return `${PROJECT_URL}/storage/v1/object/public/site_photos/${n}`;
            }catch(e){return null;} 
        }
    </script>
