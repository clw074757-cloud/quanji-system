<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全技工程行 - 管理系統 v3.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- 樣式設定 --- */
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #000000; color: #fca5a5; font-size: 16px; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        .card { background: #171717; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(220, 38, 38, 0.1); margin-bottom: 20px; border: 2px solid #7f1d1d; }
        .card-today { border-color: #f59e0b; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2); }
        .card-future { border-color: #4b5563; box-shadow: 0 4px 15px rgba(75, 85, 99, 0.2); opacity: 0.9; }
        .input-box { width: 100%; height: 50px; padding: 0 12px; background-color: #262626 !important; border: 2px solid #7f1d1d; border-radius: 12px; font-size: 16px; font-weight: bold; outline: none; margin-bottom: 12px; color: #fca5a5 !important; display: flex; align-items: center; box-sizing: border-box; -webkit-appearance: none; appearance: none; line-height: normal; }
        textarea.input-box { height: auto; padding: 12px; display: block; }
        .input-box::placeholder { color: #7f1d1d; opacity: 1; }
        .input-box:focus { border-color: #ef4444; background-color: #000000 !important; }
        select.input-box { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23dc2626' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1.5em; padding-right: 2.5rem; }
        .custom-checkbox { display: flex; align-items: center; gap: 8px; padding: 10px; background: #262626; border: 1px solid #7f1d1d; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
        .custom-checkbox input { width: 24px; height: 24px; accent-color: #dc2626; }
        .btn { width: 100%; padding: 16px; border-radius: 12px; font-weight: 900; font-size: 18px; color: #000000; transition: 0.2s; text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 0 rgba(50, 0, 0, 0.5); cursor: pointer; border: none; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-primary { background-color: #dc2626; } .btn-secondary { background-color: #404040; color: #fca5a5; } .btn-warning { background-color: #f59e0b; color: #000000; } .btn-success { background-color: #10b981; color: #000000; }
        .btn-disabled { background-color: #262626; color: #555; cursor: not-allowed; box-shadow: none; border: 1px solid #444; }
        .action-btn { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; background-color: #262626; }
        .action-btn:active { transform: scale(0.95); }
        .btn-edit { border: 1px solid #fca5a5; color: #fca5a5; }
        .btn-del { border: 1px solid #ef4444; color: #ef4444; }
        .nav-bar { background-color: #0f0f0f; border-top: 2px solid #7f1d1d; }
        .nav-btn { flex: 1; text-align: center; padding: 12px; color: #7f1d1d; font-size: 14px; font-weight: 900; background: #0f0f0f; border: none; min-width: 0; }
        .nav-btn.active { color: #ef4444; background: #1a0505; border-top: 4px solid #dc2626; }
        .nav-icon { width: 28px; height: 28px; margin: 0 auto 4px; display: block; fill: currentColor; } 
        .img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .img-grid img { width: 100%; height: 120px; object-fit: contain; background-color: #000; border-radius: 8px; border: 1px solid #7f1d1d; }
        .text-label { color: #b91c1c; font-weight: bold; margin-bottom: 4px; display: block; font-size: 14px; }
        .map-link { color: #ef4444; text-decoration: underline; font-size: 0.9rem; font-weight: bold; }
        .loader { border: 8px solid #262626; border-top: 8px solid #dc2626; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col h-full">

    <div id="login-screen" class="fixed inset-0 bg-[#000000] z-[100] flex flex-col items-center justify-center p-6">
        <div class="bg-[#171717] w-full max-w-sm p-8 rounded-3xl shadow-2xl border-4 border-[#7f1d1d]">
            <img src="https://vegqsdqxnvqupmzsgbpt.supabase.co/storage/v1/object/public/site_photos/F21060CB-BAB1-4E07-91AC-1E3F35796914.png" alt="Logo" class="w-32 h-32 mx-auto mb-4 object-contain drop-shadow-[0_0_10px_rgba(220,38,38,0.3)]">
            <h1 class="text-4xl font-black text-center text-[#dc2626] mb-2">全技工程行</h1>
            <p class="text-center text-[#fca5a5] font-bold text-lg mb-8">管理系統</p>
            <div class="w-full">
                <label class="text-label">姓名 (或帳號)</label>
                <input id="login-id" class="input-box" placeholder="請輸入帳號">
            </div>
            <div class="w-full">
                <label class="text-label">密碼</label>
                <input id="login-pwd" type="password" class="input-box" placeholder="輸入密碼">
            </div>
            <button onclick="doLogin()" class="btn btn-primary mt-6 text-2xl">登入</button>
            <p id="login-msg" class="text-center text-[#ef4444] font-bold text-base mt-4 min-h-[24px]"></p>
        </div>
    </div>

    <div id="loading-overlay" class="fixed inset-0 bg-black/95 z-[200] hidden flex flex-col items-center justify-center">
        <div class="loader"></div>
        <div id="loading-text" class="text-[#fca5a5] font-black text-xl animate-pulse">處理中...</div>
    </div>

    <div id="lightbox-modal" class="fixed inset-0 bg-black/95 z-[300] hidden flex items-center justify-center touch-none">
        <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-4xl font-bold z-[310] w-12 h-12 flex items-center justify-center bg-gray-800/50 rounded-full border border-gray-600">&times;</button>
        <button id="lb-prev" onclick="changeLightboxImage(-1)" class="absolute left-2 text-white text-5xl font-bold z-[310] p-4 hidden bg-gray-800/30 h-24 flex items-center rounded-r-xl">&#8249;</button>
        <button id="lb-next" onclick="changeLightboxImage(1)" class="absolute right-2 text-white text-5xl font-bold z-[310] p-4 hidden bg-gray-800/30 h-24 flex items-center rounded-l-xl">&#8250;</button>
        <img id="lightbox-img" class="max-h-[90vh] max-w-[95vw] object-contain select-none" src="">
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-black/90 z-[80] hidden flex items-center justify-center p-4">
        <div class="bg-[#171717] w-full max-w-md p-6 rounded-2xl border-2 border-[#dc2626] max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-black mb-4 text-[#dc2626]">✏️ 修改資料</h3>
            <input type="hidden" id="edit-id"><input type="hidden" id="edit-type">
            <div id="edit-name-group"><label class="text-label">名稱</label><input id="edit-name" class="input-box"></div>
            <div id="edit-time-group"><label class="text-label">時間</label><input id="edit-time" type="datetime-local" class="input-box" style="color-scheme: dark;"></div>
            <div id="edit-clock-area" class="hidden"><label class="text-label">類型</label><select id="edit-check-type" class="input-box"><option value="上班">上班</option><option value="下班">下班</option></select></div>
            <div id="edit-prog-area" class="hidden"><label class="text-label">工程名稱</label><input id="edit-proj" class="input-box"><label class="text-label">進度</label><input id="edit-prog" class="input-box"><label class="text-label">備註</label><textarea id="edit-note" class="input-box" rows="2"></textarea></div>
            <div id="edit-dispatch-area" class="hidden"><label class="text-label">指派負責人</label><input id="edit-dispatch-emp" class="input-box" readonly><label class="text-label">陪同人員</label><div id="edit-dispatch-partners-list" class="grid grid-cols-2 gap-2 mb-3"></div><label class="text-label">施工地點</label><input id="edit-dispatch-loc" class="input-box"><label class="text-label">派工內容</label><textarea id="edit-dispatch-note" class="input-box" rows="3"></textarea></div>
            <div id="edit-emp-area" class="hidden"><label class="text-label">員工編號</label><input id="edit-code" class="input-box" placeholder="例如：A01"><label class="text-label">日薪 (元)</label><input id="edit-wage" type="number" class="input-box"><label class="text-label">登入密碼</label><input id="edit-pwd" type="text" class="input-box"><div class="mt-4 p-3 bg-[#262626] rounded border border-[#7f1d1d]"><label class="custom-checkbox"><input type="checkbox" id="edit-is-admin"><span class="text-[#ef4444] font-bold text-lg">⚠️ 設為管理員</span></label></div></div>
            <div id="edit-payout-area" class="hidden"><label class="text-label">計薪開始日期</label><input id="edit-pay-start" type="date" class="input-box" style="color-scheme: dark;"><label class="text-label">計薪結束日期</label><input id="edit-pay-end" type="date" class="input-box" style="color-scheme: dark;"><label class="text-label">總發放金額</label><input id="edit-pay-amount" type="number" class="input-box"></div>
            <div class="flex gap-3 mt-4"><button onclick="closeEdit()" class="btn btn-secondary">取消</button><button onclick="saveEdit()" class="btn btn-primary">儲存</button></div>
        </div>
    </div>

    <header class="bg-[#0f0f0f] border-b-2 border-[#7f1d1d] sticky top-0 z-40 px-4 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <img src="https://vegqsdqxnvqupmzsgbpt.supabase.co/storage/v1/object/public/site_photos/F21060CB-BAB1-4E07-91AC-1E3F35796914.png" alt="Logo" class="w-10 h-10 object-contain">
            <div>
                <h1 class="text-xl font-black tracking-widest text-[#dc2626]">全技工程行</h1>
                <div class="flex items-center gap-2 mt-1"><span class="w-2 h-2 rounded-full bg-[#ef4444] border border-black animate-pulse"></span><span id="user-role-display" class="text-xs font-bold text-[#fca5a5]">未登入</span></div>
            </div>
        </div>
        <button onclick="logout()" class="text-xs font-bold bg-[#262626] text-[#ef4444] px-3 py-2 rounded-lg border border-[#7f1d1d]">登出</button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-32 bg-black">
        
        <div id="page-clock" class="hidden">
            <div class="card">
                <h2 class="text-center font-black text-[#fca5a5] text-2xl mb-1">👋 <span id="greeting-text">早安</span>，<span id="welcome-name" class="text-[#dc2626]">員工</span></h2>
                <p class="text-center text-[#7f1d1d] font-bold mb-6" id="current-time-display">--:--</p>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <button onclick="clockIn('上班')" class="btn btn-primary text-2xl py-8 shadow-xl hover:bg-red-500">上班</button>
                    <button onclick="clockIn('下班')" class="btn btn-secondary text-2xl py-8 shadow-xl border border-[#7f1d1d]">下班</button>
                </div>
                
                <div id="my-salary-container" class="mt-4 mb-4 pt-4 border-t border-[#404040]">
                    <div class="flex justify-between items-center bg-[#262626] p-4 rounded-xl border border-[#404040]">
                        <div class="font-bold text-[#fca5a5]">💰 本週預估薪資</div>
                        <div id="my-salary-text" class="text-2xl font-black text-[#dc2626] font-mono">$0</div>
                    </div>
                    <div class="text-right text-xs text-[#7f1d1d] mt-1 pr-2">* 僅供參考，以管理員結算為準</div>
                </div>

                <div id="upcoming-missions-container"></div>
                <div class="mt-4 text-center"><span id="gps-status" class="text-sm font-bold text-[#ef4444] bg-[#262626] px-3 py-1 rounded-full border border-[#7f1d1d]">📍 定位搜尋中...</span></div>
            </div>
            <div class="card">
                <h3 class="text-xl font-black text-[#ef4444] mb-4 border-b border-[#7f1d1d] pb-2">📅 我的記錄</h3>
                <div id="my-records-list" class="space-y-3 font-bold py-2">無記錄</div>
            </div>
        </div>

        <div id="page-task" class="hidden">
            <div class="card card-highlight mb-4">
                <h2 class="font-black text-yellow-500 text-xl mb-4">📋 團隊派工總覽</h2>
                <div id="public-task-list" class="space-y-3"><div class="text-center text-[#7f1d1d] font-bold py-10">載入中...</div></div>
            </div>
        </div>

        <div id="page-bulletin" class="hidden">
            <div class="card">
                <h2 class="font-black text-[#dc2626] text-xl mb-4">📢 派工回報</h2>
                <div class="space-y-4">
                    <div><label class="text-label">工程名稱</label><input id="prog-project" placeholder="工程名稱 / 案場" class="input-box"></div>
                    <div><label class="text-label">備註說明</label><textarea id="prog-note" rows="2" placeholder="施工內容備註..." class="input-box"></textarea></div>
                    <div onclick="document.getElementById('file-upload').click()" class="border-4 border-dashed border-[#404040] bg-[#171717] hover:border-[#dc2626] rounded-2xl p-6 text-center cursor-pointer relative group">
                        <input type="file" id="file-upload" accept="image/*" multiple class="hidden" onchange="previewImages(this)">
                        <div id="upload-placeholder"><span class="text-4xl block mb-2">📷</span><p class="text-[#7f1d1d] font-bold text-lg">點擊選擇照片 (可多張)</p></div>
                        <div id="preview-container" class="hidden grid grid-cols-3 gap-2 mt-2"></div>
                        <div id="clear-btn" class="hidden absolute -top-2 -right-2 bg-[#dc2626] text-black w-8 h-8 rounded-full flex items-center justify-center font-bold text-xl shadow-md border border-black z-10" onclick="event.stopPropagation(); clearImages()">✕</div>
                    </div>
                    <button onclick="submitProgress()" class="btn btn-primary text-xl">發佈回報</button>
                </div>
            </div>
            <h3 class="text-xl font-black text-[#fca5a5] mb-4 px-2">📋 最新派工回報</h3>
            <div id="bulletin-list" class="space-y-4"><div class="text-center text-[#7f1d1d] font-bold py-10">載入中...</div></div>
        </div>

        <div id="page-admin" class="hidden">
            <button onclick="manualRefresh()" class="btn btn-secondary mb-4 border border-[#dc2626] shadow-lg">🔄 更新數據</button>

            <div class="card border-yellow-600">
                <h2 class="font-black text-yellow-500 text-xl mb-4">👷 派工指派</h2>
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-label">指派負責人</label><select id="dispatch-emp-select" class="input-box"></select></div>
                        <div><label class="text-label">日期</label><input type="date" id="dispatch-date" class="input-box" style="color-scheme: dark;"></div>
                    </div>
                    <div><label class="text-label">陪同人員 (勾選)</label><div id="dispatch-partners-list" class="grid grid-cols-2 gap-2 bg-[#262626] p-3 rounded border border-[#7f1d1d]"></div></div>
                    <div><label class="text-label">施工地點</label><input id="dispatch-loc" placeholder="輸入地點" class="input-box"></div>
                    <div><label class="text-label">派工內容</label><textarea id="dispatch-note" placeholder="輸入詳細工作內容..." rows="2" class="input-box"></textarea></div>
                    <button onclick="submitDispatch()" class="btn btn-warning text-lg">指派任務</button>
                </div>
                <h3 class="font-bold text-[#fca5a5] mt-6 mb-2">📅 派工歷史記錄</h3>
                <div id="dispatch-list" class="space-y-2"></div>
            </div>

            <div class="card">
                <h2 class="font-black text-[#dc2626] text-xl mb-4">👤 員工資料管理</h2>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div><label class="text-label">帳號</label><input id="new-id" placeholder="自訂 (如: boss)" class="input-box"></div>
                    <div><label class="text-label">編號</label><input id="new-code" placeholder="如: A01" class="input-box"></div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div><label class="text-label">姓名</label><input id="new-name" placeholder="姓名" class="input-box"></div>
                    <div><label class="text-label">日薪</label><input id="new-wage" placeholder="金額" type="number" class="input-box"></div>
                </div>
                <label class="text-label">密碼</label><input id="new-pwd" placeholder="密碼 (預設1234)" class="input-box mb-3">
                <div class="mb-4 p-3 bg-[#262626] rounded border border-[#7f1d1d]">
                    <label class="custom-checkbox"><input type="checkbox" id="new-is-admin"><span class="text-[#ef4444] font-bold text-lg">⚠️ 設為管理員</span></label>
                </div>
                <button onclick="addEmployee()" class="btn btn-secondary border border-[#dc2626] mb-6">＋ 新增員工</button>
                <h3 class="font-bold text-[#fca5a5] border-b border-[#7f1d1d] pb-2 mb-2">現有員工列表 (可刪除)</h3>
                <div id="emp-directory-list" class="space-y-3"></div>
            </div>

            <div class="card">
                <div class="flex justify-between items-end border-b border-[#7f1d1d] pb-3 mb-3">
                    <div>
                        <span class="font-bold text-[#fca5a5] text-lg block">💰 薪資計算</span>
                        <div id="current-week-display" class="text-xs text-yellow-500 font-bold mt-1"></div>
                        <div id="settled-status" class="hidden text-xs text-green-500 font-bold mt-1">✓ 本週已結算歸檔</div>
                    </div>
                    <span id="total-wage" class="font-black text-[#dc2626] text-3xl font-mono">$0</span>
                </div>
                
                <div class="flex justify-between mb-4 bg-[#262626] rounded-lg p-1 border border-[#404040]">
                    <button onclick="changeWeek(-1)" class="flex-1 text-[#fca5a5] font-bold py-2 hover:bg-[#404040] rounded">⬅️ 上週</button>
                    <button onclick="changeWeek(0)" class="flex-1 text-white font-bold py-2 hover:bg-[#404040] rounded border-x border-[#404040]">本週</button>
                    <button onclick="changeWeek(1)" class="flex-1 text-[#fca5a5] font-bold py-2 hover:bg-[#404040] rounded">下週 ➡️</button>
                </div>

                <div id="salary-calc-list" class="space-y-3 mb-6"></div>
                <button id="btn-settle" onclick="settleSalary()" class="btn btn-success text-xl shadow-lg border-2 border-green-800">💰 結算本週薪資 (歸檔)</button>
            </div>

            <h3 class="text-xl font-black text-[#fca5a5] mt-8 mb-4 px-2">📜 歷史薪資發放記錄</h3>
            <div id="payout-history-list" class="space-y-3 mb-8"><div class="text-center text-[#7f1d1d]">無歷史記錄</div></div>

            <h3 class="text-xl font-black text-[#fca5a5] mt-4 mb-4 px-2">📋 員工出勤記錄</h3>
            <div id="admin-clock-list" class="space-y-3"></div>
        </div>
    </main>

    <nav id="bottom-nav" class="nav-bar fixed bottom-0 w-full flex pb-safe z-50 shadow-2xl"></nav>
    
    <script>
        const PROJECT_URL = 'https://vegqsdqxnvqupmzsgbpt.supabase.co';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZ3FzZHF4bnZxdXBtenNnYnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3OTI0MDAsImV4cCI6MjA4NTM2ODQwMH0.ZHluSDbAD_ih4GH25ZBXZGogorfNUfBOcICb5pvhIq0';
        let supabaseClient = null; if(window.supabase) supabaseClient = window.supabase.createClient(PROJECT_URL, ANON_KEY);
        const DB_URL = `${PROJECT_URL}/rest/v1/construction_records`;
        const STORAGE_URL = `${PROJECT_URL}/storage/v1/object/site_photos`;
        const HEADERS = { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

        let allData = [], currentUser = null, currentLocation = null, currentWeeklyData = {};
        let currentViewDate = new Date();
        let lbImages = [], lbIndex = 0; // Lightbox variables

        window.onload = async function() {
            if(window.supabase && !supabaseClient) supabaseClient = window.supabase.createClient(PROJECT_URL, ANON_KEY);
            setInterval(() => {
                const n = new Date();
                if(document.getElementById('current-time-display')) document.getElementById('current-time-display').innerText = `${n.toLocaleString('zh-TW', {weekday:'long', month:'long', day:'numeric'})} ${n.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'})}`;
                
                const h = n.getHours();
                let greet = "早安";
                if(h >= 12 && h < 18) greet = "午安";
                else if(h >= 18) greet = "晚安";
                const gEl = document.getElementById('greeting-text');
                if(gEl) gEl.innerText = greet;
            }, 1000);

            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => { currentLocation = `${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`; document.getElementById('gps-status').innerText = `📍 已定位`; document.getElementById('gps-status').className = "text-sm font-bold text-[#fca5a5] bg-[#1a0505] px-3 py-1 rounded-full border border-[#dc2626]"; }, () => { document.getElementById('gps-status').innerText = "⚠️ 定位失敗"; });
            } else { document.getElementById('gps-status').innerText = "⚠️ 裝置不支援定位"; }
            await loadData();
            const savedId = localStorage.getItem('last_user_id');
            if (savedId) {
                if(savedId === 'admin') { currentUser = { employee_name: '超級管理員', is_admin: true, employee_id: 'admin' }; performLogin(currentUser); }
                else { const user = allData.find(r => r.type === 'employee' && r.employee_id === savedId); if(user) { currentUser = user; performLogin(user); } }
            }
            document.getElementById('dispatch-date').valueAsDate = new Date();
        };

        // Lightbox Functions
        function openLightbox(urlOrArray, index = 0) {
            if (Array.isArray(urlOrArray)) {
                lbImages = urlOrArray;
                lbIndex = index;
            } else {
                lbImages = [urlOrArray];
                lbIndex = 0;
            }
            updateLightbox();
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.add('hidden');
            lbImages = [];
        }

        function updateLightbox() {
            const img = document.getElementById('lightbox-img');
            const prev = document.getElementById('lb-prev');
            const next = document.getElementById('lb-next');

            img.src = lbImages[lbIndex];

            if (lbImages.length > 1) {
                prev.classList.remove('hidden');
                next.classList.remove('hidden');
            } else {
                prev.classList.add('hidden');
                next.classList.add('hidden');
            }
        }

        function changeLightboxImage(dir) {
            lbIndex += dir;
            if (lbIndex < 0) lbIndex = lbImages.length - 1;
            if (lbIndex >= lbImages.length) lbIndex = 0;
            updateLightbox();
        }

        function changeWeek(offset) {
            currentViewDate.setDate(currentViewDate.getDate() + (offset * 7));
            render();
        }

        function getWeekRange(baseDate) {
            const d = new Date(baseDate);
            d.setHours(0,0,0,0);
            const day = d.getDay();
            const diff = d.getDate() - day + (day == 0 ? -6 : 1); 
            const monday = new Date(d.setDate(diff));
            const nextMonday = new Date(monday);
            nextMonday.setDate(monday.getDate() + 7);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            return { monday: monday, nextMonday: nextMonday, startStr: monday.toLocaleDateString('zh-TW'), endStr: sunday.toLocaleDateString('zh-TW') };
        }

        async function loadData() {
            try { const res = await fetch(`${DB_URL}?select=*&order=created_at.desc`, { headers: HEADERS }); if(!res.ok) throw new Error("Err"); const data = await res.json(); allData = data.map(r => ({ id: r.id, type: r.type, created_at: r.created_at, ...r.data })); if(currentUser) render(); } catch(e){ console.error(e); }
        }
        function doLogin() {
            const id = document.getElementById('login-id').value.trim(), pwd = document.getElementById('login-pwd').value.trim();
            if(!id || !pwd) return alert("請輸入帳號密碼");
            if(id==='admin' && pwd==='admin') { currentUser = { employee_name: '超級管理員', is_admin: true, employee_id: 'admin' }; localStorage.setItem('last_user_id', 'admin'); performLogin(currentUser); return; }
            const u = allData.find(r => r.type==='employee' && (r.employee_name===id || r.employee_id===id || r.employee_code===id));
            if(u && u.password===pwd) { localStorage.setItem('last_user_id', u.employee_id); currentUser = u; performLogin(u); } else { document.getElementById('login-msg').innerText = "帳號或密碼錯誤"; }
        }
        
        function performLogin(u) {
            try {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('welcome-name').innerText = u.employee_name;
                document.getElementById('user-role-display').innerText = u.employee_name + (u.is_admin ? ' (管理員)' : ' (員工)');
                
                try { setupNav(); } catch(e) { console.error('Nav Error:', e); }
                try { nav('clock'); } catch(e) { console.error('Page Error:', e); }
                try { render(); } catch(e) { console.error('Render Error:', e); alert('部分資料載入失敗，請重新整理'); }
                
                try { if("Notification" in window) Notification.requestPermission(); if(supabaseClient) setupRealtimeListener(); } catch(e){}
            } catch(mainErr) {
                alert("登入過程發生嚴重錯誤，請截圖給開發者: " + mainErr.message);
                location.reload();
            }
        }

        function render() {
            const isAdmin = currentUser.is_admin;
            const emps = allData.filter(r => r.type === 'employee');
            const today = new Date(); today.setHours(0,0,0,0);

            // 計算薪資邏輯 (所有人可見)
            const myWage = parseInt(currentUser.wage) || 0;
            let myTotalPay = 0;
            const thisWeek = getWeekRange(new Date());
            const myDailyGroups = {};
            
            allData.filter(r => r.type === 'clock' && r.employee_name === currentUser.employee_name).forEach(r => {
                const t = new Date(r.timestamp);
                if(t >= thisWeek.monday && t < thisWeek.nextMonday) {
                    const k = t.toDateString();
                    if(!myDailyGroups[k]) myDailyGroups[k] = {start:null, end:null};
                    const tv = t.getTime();
                    if(r.check_type === '上班' && (!myDailyGroups[k].start || tv < myDailyGroups[k].start)) myDailyGroups[k].start = tv;
                    if(r.check_type === '下班' && (!myDailyGroups[k].end || tv > myDailyGroups[k].end)) myDailyGroups[k].end = tv;
                }
            });

            Object.values(myDailyGroups).forEach(v => {
                if(v.start && v.end) {
                    const hrs = (v.end - v.start) / 36e5;
                    const pay = (Math.max(0, hrs - 1) >= 7.5) ? myWage : Math.floor(Math.max(0, hrs - 1) * (myWage / 8));
                    myTotalPay += pay;
                }
            });
            const salaryEl = document.getElementById('my-salary-text');
            if(salaryEl) salaryEl.innerText = `$${myTotalPay.toLocaleString()}`;

            // 員工端：派工
            const myMissions = allData.filter(r => r.type==='dispatch' && new Date(r.timestamp)>=today && (r.employee_name===currentUser.employee_name || (r.partners||'').includes(currentUser.employee_name))).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
            document.getElementById('upcoming-missions-container').innerHTML = myMissions.map(m => {
                const isToday = new Date(m.timestamp).toDateString() === today.toDateString();
                const partnerText = m.partners ? `<div class="text-sm text-[#fca5a5] mt-1">👥 陪同：${m.partners}</div>` : '';
                return `<div class="card ${isToday?'card-today border-l-yellow-500':'card-future border-l-gray-500'} border-l-8 mb-4 relative"><div class="absolute -top-3 -right-2 ${isToday?'bg-yellow-500 text-black':'bg-gray-600 text-white'} font-black px-3 py-1 rounded-full text-sm">${isToday?'今日派工':new Date(m.timestamp).toLocaleDateString('zh-TW')}</div><h3 class="text-xl font-black mb-2">🚀 派工</h3><div class="mb-1">負責：${m.employee_name}</div><div class="mb-1">地點：${m.project_name}</div>${partnerText}<div class="bg-[#262626] p-3 rounded mt-2">${m.notes}</div></div>`;
            }).join('');

            // 公共區
            const allTasks = allData.filter(r => r.type==='dispatch').sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
            document.getElementById('public-task-list').innerHTML = allTasks.map(t => {
                const partnerBadge = t.partners ? `<div class="text-sm text-yellow-600 mt-1">👥 陪同：${t.partners}</div>` : '';
                return `<div class="bg-[#171717] border border-yellow-900/50 rounded-xl p-4 shadow-sm mb-2"><div class="flex justify-between mb-1"><span class="text-lg font-black text-yellow-500">${t.employee_name}</span><span class="text-xs text-[#7f1d1d] border border-[#7f1d1d] px-2 rounded">${new Date(t.timestamp).toLocaleDateString('zh-TW')}</span></div><div class="text-[#fca5a5]">${t.project_name}</div>${partnerBadge}<div class="text-sm bg-[#262626] p-2 rounded mt-2 text-[#fca5a5]">${t.notes}</div></div>`
            }).join('');
            
            const bulletins = allData.filter(r => r.type==='progress');
            document.getElementById('bulletin-list').innerHTML = bulletins.map(r => {
                let imgs = '';
                if (r.image_url) {
                    const urls = Array.isArray(r.image_url) ? r.image_url : [r.image_url];
                    if (urls.length > 0) {
                        const safeUrls = JSON.stringify(urls).replace(/"/g, "&quot;");
                        imgs = `<div class="img-grid">${urls.map((u, idx) => `<img src="${u}" onclick="openLightbox(${safeUrls}, ${idx})">`).join('')}</div>`;
                    }
                }
                return `<div class="card relative">${isAdmin?`<div class="absolute top-4 right-4"><button onclick="del(this,${r.id})" class="action-btn btn-del">✕</button></div>`:''}<div class="flex items-center gap-3 mb-2"><div class="w-10 h-10 rounded-full bg-[#404040] flex items-center justify-center font-bold text-[#fca5a5] border border-[#7f1d1d]">${r.employee_name[0]}</div><div><div class="font-bold text-[#fca5a5]">${r.employee_name}</div><div class="text-xs text-[#7f1d1d]">${new Date(r.timestamp).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div></div><div class="font-bold text-xl text-[#ef4444] mb-1">${r.project_name}</div><div class="bg-[#262626] p-3 rounded-lg border border-[#7f1d1d] font-bold text-[#fca5a5]">${r.notes}</div>${imgs}</div>`;
            }).join('');

            const myRecs = allData.filter(r => r.type==='clock' && r.employee_name===currentUser.employee_name).slice(0,20);
            document.getElementById('my-records-list').innerHTML = myRecs.map(r => `<div class="flex justify-between items-center p-4 bg-[#171717] rounded-xl border-l-8 ${r.check_type==='上班'?'border-l-green-600':'border-l-orange-600'} border-2 border-[#262626] mb-2"><div><span class="font-black text-lg text-[#fca5a5] mr-2">${r.check_type}</span>${getOvertimeDisplay(r)}</div><span class="font-bold text-[#7f1d1d] font-mono">${new Date(r.timestamp).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>`).join('');

            if(isAdmin) {
                document.getElementById('dispatch-emp-select').innerHTML = emps.map(e => `<option value="${e.employee_name}">${e.employee_name}</option>`).join('');
                document.getElementById('dispatch-partners-list').innerHTML = emps.map(e => `<label class="custom-checkbox"><input type="checkbox" value="${e.employee_name}"><span class="text-[#fca5a5] font-bold">${e.employee_name}</span></label>`).join('');
                document.getElementById('dispatch-list').innerHTML = allData.filter(r=>r.type==='dispatch').map(d=>`<div class="bg-[#262626] p-3 rounded border border-yellow-900 flex justify-between"><div><div class="font-bold text-yellow-500">${new Date(d.timestamp).toLocaleDateString('zh-TW')} ➤ ${d.employee_name}</div><div class="text-[#fca5a5]">${d.project_name}</div>${d.partners?`<div class="text-xs text-gray-400">👥 ${d.partners}</div>`:''}<div class="text-sm text-[#7f1d1d] mt-1">${d.notes}</div></div><div class="flex gap-2"><button onclick="openEdit(${d.id})" class="action-btn btn-edit">✏️</button><button onclick="del(this,${d.id})" class="action-btn btn-del">✕</button></div></div>`).join('');

                const empMap={}; emps.forEach(e => empMap[e.employee_name]=parseInt(e.wage)||0);
                const weekRange = getWeekRange(currentViewDate);
                document.getElementById('current-week-display').innerText = `週期：${weekRange.startStr} ~ ${weekRange.endStr}`;
                const hasSettledThisWeek = allData.some(r => r.type === 'payout_history' && r.start_date === weekRange.startStr);

                currentWeeklyData = { startDate: weekRange.startStr, endDate: weekRange.endStr, details: [] };
                const weeklyCalc={}; const workDaysCount={}; const dailyGroups={};

                allData.filter(r => r.type==='clock').forEach(r => {
                    const t = new Date(r.timestamp);
                    if(t >= weekRange.monday && t < weekRange.nextMonday) {
                        const k = `${r.employee_name}|${t.toDateString()}`;
                        if(!dailyGroups[k]) dailyGroups[k]={start:null, end:null};
                        const tv = t.getTime();
                        if(r.check_type==='上班' && (!dailyGroups[k].start || tv<dailyGroups[k].start)) dailyGroups[k].start = tv;
                        if(r.check_type==='下班' && (!dailyGroups[k].end || tv>dailyGroups[k].end)) dailyGroups[k].end = tv;
                    }
                });

                Object.entries(dailyGroups).forEach(([k,v]) => {
                    const name = k.split('|')[0];
                    if(v.start && v.end) {
                        const hrs = (v.end - v.start)/36e5; 
                        const wage = empMap[name]||0;
                        const pay = (Math.max(0, hrs-1) >= 7.5) ? wage : Math.floor(Math.max(0, hrs-1)*(wage/8));
                        weeklyCalc[name] = (weeklyCalc[name]||0) + pay;
                        workDaysCount[name] = (workDaysCount[name]||0) + 1;
                    }
                });

                document.getElementById('emp-directory-list').innerHTML = emps.map(e => `<div class="flex justify-between items-center p-3 bg-[#171717] rounded-xl border border-[#7f1d1d] shadow-sm"><div><div class="font-black text-[#fca5a5]">${e.employee_code?`[${e.employee_code}]`:''} ${e.employee_name} ${e.is_admin?'(Admin)':''}</div><div class="text-xs text-[#7f1d1d]">日薪: $${e.wage}</div></div><div class="flex gap-2"><button onclick="openEdit(${e.id})" class="action-btn btn-edit">✏️</button><button onclick="del(this,${e.id})" class="action-btn btn-del">✕</button></div></div>`).join('');

                let totalSalary = 0;
                document.getElementById('salary-calc-list').innerHTML = emps.map(e => {
                    let pay = weeklyCalc[e.employee_name] || 0;
                    const days = workDaysCount[e.employee_name] || 0;
                    if(pay > 0) currentWeeklyData.details.push({name:e.employee_name, code:e.employee_code, pay:pay, days:days});
                    totalSalary += pay;
                    let settledText = hasSettledThisWeek ? '<span class="text-xs text-green-500 font-bold ml-2">(已結算)</span>' : '';
                    return `<div class="flex justify-between items-center p-4 bg-[#262626] rounded-xl border border-[#404040]"><div class="font-bold text-[#fca5a5]">${e.employee_name}</div><div class="text-right"><div class="text-xs text-[#7f1d1d]">本週出勤 ${days} 天</div><div class="font-black text-[#dc2626] text-xl">$${pay.toLocaleString()}${settledText}</div></div></div>`;
                }).join('');

                const btnSettle = document.getElementById('btn-settle');
                const statusDiv = document.getElementById('settled-status');
                currentWeeklyData.total = totalSalary;
                
                if(hasSettledThisWeek) {
                    document.getElementById('total-wage').innerText = "$0"; 
                    btnSettle.innerText = "已完成結算";
                    btnSettle.classList.add('btn-disabled');
                    btnSettle.onclick = null;
                    statusDiv.classList.remove('hidden');
                } else {
                    document.getElementById('total-wage').innerText = "$" + totalSalary.toLocaleString();
                    btnSettle.innerText = "💰 結算本週薪資 (歸檔)";
                    btnSettle.classList.remove('btn-disabled');
                    btnSettle.onclick = settleSalary;
                    statusDiv.classList.add('hidden');
                }

                const historyList = allData.filter(r=>r.type==='payout_history');
                document.getElementById('payout-history-list').innerHTML = historyList.length ? historyList.map(h => `<div class="bg-[#262626] border border-green-900 rounded-lg p-3 relative group"><div class="flex justify-between items-start"><div><div class="text-green-500 font-bold text-lg">💰 已發放: $${parseInt(h.total_amount).toLocaleString()}</div><div class="text-[#7f1d1d] text-xs font-bold">結算日: ${new Date(h.timestamp).toLocaleDateString()}</div><div class="text-xs text-yellow-500">週期: ${h.start_date}~${h.end_date}</div></div><div class="flex flex-col items-end gap-2"><button onclick="exportToCSV('${h.id}')" class="bg-white text-black text-xs font-bold px-3 py-1 rounded">📊 CSV</button><div class="flex gap-2"><button onclick="openEdit(${h.id})" class="action-btn btn-edit">✏️</button><button onclick="del(this,${h.id})" class="action-btn btn-del">✕</button></div></div></div></div>`).join('') : '<div class="text-center text-[#7f1d1d]">無記錄</div>';
                document.getElementById('admin-clock-list').innerHTML = allData.filter(r=>r.type==='clock').map(r => `<div class="flex justify-between items-center p-3 bg-[#171717] rounded-lg border border-[#262626] mb-2"><div><span class="font-black text-[#fca5a5] mr-2">${r.employee_name}</span><span class="text-[#7f1d1d] text-sm">${new Date(r.timestamp).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div><div class="flex items-center gap-2"><span class="${r.check_type==='上班'?'text-green-600':'text-orange-600'} font-bold">${r.check_type}</span><button onclick="openEdit(${r.id})" class="action-btn btn-edit">✏️</button><button onclick="del(this,${r.id})" class="action-btn btn-del">✕</button></div></div>`).join('');
            }
        }

        // --- CSV 匯出 ---
        function exportToCSV(id) {
            const record = allData.find(r => r.id == id);
            if (!record) return alert("找不到記錄");
            let csvContent = "\uFEFF"; 
            csvContent += "編號,姓名,出勤天數,實發金額,備註\n";
            record.details.forEach(d => { csvContent += `${d.code || '-'},${d.name},${d.days},${d.pay}\n`; });
            csvContent += `,,總計,${record.total_amount},\n`;
            csvContent += `週期,${record.start_date} ~ ${record.end_date},,,\n`;
            csvContent += `經辦人,${record.settled_by || '系統'},,,\n`;
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `薪資明細_${record.start_date}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function logout() { localStorage.removeItem('last_user_id'); currentUser = null; location.reload(); }

        function getOvertimeDisplay(r) {
            if (r.check_type !== '下班') return '';
            const cStr = new Date(r.timestamp).toDateString(); 
            const sRecs = allData.filter(x => x.type === 'clock' && x.employee_name === r.employee_name && x.check_type === '上班' && new Date(x.timestamp).toDateString() === cStr);
            if (sRecs.length === 0) return '';
            const dur = (new Date(r.timestamp) - Math.min(...sRecs.map(x=>new Date(x.timestamp)))) / 36e5;
            if (dur > 9) {
                const ot = dur - 9;
                const h = Math.floor(ot);
                const m = Math.round((ot - h) * 60);
                return `<span class="text-[#dc2626] font-black text-sm ml-2 bg-[#262626] px-2 py-1 rounded-full border border-[#7f1d1d]">加班 ${h}小時${m}分</span>`;
            }
            return '';
        }

        async function insertData(t, d) { try{const r=await fetch(DB_URL,{method:'POST',headers:HEADERS,body:JSON.stringify({type:t,data:d})});return r.ok;}catch(e){return false;} }
        async function updateDataAPI(i, d) { try{const r=await fetch(`${DB_URL}?id=eq.${i}`,{method:'PATCH',headers:HEADERS,body:JSON.stringify({data:d})});return r.ok;}catch(e){return false;} }
        async function deleteDataAPI(i) { await fetch(`${DB_URL}?id=eq.${i}`,{method:'DELETE',headers:HEADERS}); return true; }
        async function del(b,i) { if(confirm("確定刪除？")) if(await deleteDataAPI(i)) await loadData(); }
        async function uploadFileAPI(f) { const n=`img_${Date.now()}_${Math.random().toString(36).substr(2, 5)}.jpg`; try{const r=await fetch(`${STORAGE_URL}/${n}`,{method:'POST',headers:{'apikey':ANON_KEY,'Authorization':`Bearer ${ANON_KEY}`,'Content-Type':f.type,'x-upsert':'true'},body:f}); if(!r.ok)return null; return `${PROJECT_URL}/storage/v1/object/public/site_photos/${n}`; }catch(e){return null;} }
    </script>
